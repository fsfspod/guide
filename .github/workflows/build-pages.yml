# Rebuilds the case, topic and episode pages and sitemap.xml from content.js.
# Runs when content.js (or the design) changes, and once a day so
# scheduled releases (releaseAt) show as "Out now" on their own.
name: Build pages

on:
  push:
    branches: [main]
    paths:
      - content.js
      - index.html
      - scripts/build-pages.js
  schedule:
    - cron: "17 9 * * *"   # daily, ~3 a.m. Mountain
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-pages.js
      - name: Commit any changes
        run: |
          git add -A case cases topics episodes assets/pages.css sitemap.xml scripts/page-dates.json
          if git diff --cached --quiet; then
            echo "Pages already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild pages"
            # A newer commit may have landed while this ran; replay on top of it.
            git pull --rebase origin main
            git push
          fi
